<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f5">
  <title>Daylight — your tasks, in focus</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f7f5;
      --card: #fff;
      --text: #222820;
      --muted: #788076;
      --line: #e8ebe6;
      --accent: #547b5c;
      --accent-soft: #edf4ed;
      --danger: #b84d45;
      --shadow: 0 18px 55px rgb(35 48 36 / 8%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #171b18;
        --card: #202621;
        --text: #edf2eb;
        --muted: #a0aa9f;
        --line: #343c35;
        --accent: #a4c7a6;
        --accent-soft: #2b382d;
        --danger: #f08a7f;
        --shadow: 0 18px 55px rgb(0 0 0 / 24%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 72px 22px 48px;
      background:
        radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 48%),
        var(--page);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(100%, 480px);
      margin: 0 auto;
      animation: arrive 520ms cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 11px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .sun {
      display: grid;
      width: 23px;
      height: 23px;
      place-items: center;
      border-radius: 50%;
      background: var(--accent-soft);
      font-size: 14px;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 40px);
      font-weight: 650;
      letter-spacing: -.045em;
      line-height: 1.12;
    }

    .subtitle {
      margin: 10px 0 28px;
      color: var(--muted);
      font-size: 15px;
    }

    .panel {
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .add-form {
      display: flex;
      gap: 10px;
      padding: 17px;
      border-bottom: 1px solid var(--line);
    }

    .add-form input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 15px;
    }

    .add-form input::placeholder { color: var(--muted); opacity: .8; }
    .add-form:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }

    .add-button {
      display: grid;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 0;
      border-radius: 11px;
      background: var(--accent);
      color: var(--page);
      cursor: pointer;
      font-size: 23px;
      font-weight: 400;
      line-height: 1;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .add-button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .add-button:active { transform: scale(.94); }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 19px 12px;
    }

    .filters { display: flex; gap: 4px; }

    .filter, .clear-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
    }

    .filter {
      padding: 6px 9px;
      border-radius: 8px;
      transition: background 160ms ease, color 160ms ease;
    }

    .filter:hover { color: var(--text); }
    .filter[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
    .clear-button { padding: 6px 0 6px 8px; }
    .clear-button:hover { color: var(--danger); }

    .task-list {
      margin: 0;
      padding: 0 19px;
      list-style: none;
    }

    .task {
      display: flex;
      min-height: 58px;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--line);
      animation: task-in 240ms ease both;
    }

    .task.removing { animation: task-out 190ms ease forwards; pointer-events: none; }

    .check-wrap {
      position: relative;
      display: grid;
      flex: 0 0 21px;
      width: 21px;
      height: 21px;
      place-items: center;
    }

    .check-wrap input {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
      opacity: 0;
    }

    .checkmark {
      display: grid;
      width: 21px;
      height: 21px;
      place-items: center;
      border: 1.5px solid #cbd2c9;
      border-radius: 7px;
      background: transparent;
      color: #fff;
      transition: background 200ms ease, border-color 200ms ease, transform 220ms cubic-bezier(.2,.8,.2,1);
    }

    .check-wrap input:hover + .checkmark { border-color: var(--accent); }
    .check-wrap input:focus-visible + .checkmark { outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 3px; }
    .check-wrap input:checked + .checkmark { transform: scale(1.08); border-color: var(--accent); background: var(--accent); }
    .checkmark svg { width: 13px; height: 13px; opacity: 0; transform: scale(.5); transition: opacity 150ms ease, transform 180ms ease; }
    .check-wrap input:checked + .checkmark svg { opacity: 1; transform: scale(1); }

    .task-title {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 15px;
      transition: color 180ms ease, opacity 180ms ease;
    }

    .task.done .task-title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }

    .delete-button {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
      transition: background 150ms ease, color 150ms ease, opacity 150ms ease;
    }

    .task:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
    .delete-button:hover { background: color-mix(in srgb, var(--danger) 11%, transparent); color: var(--danger); }
    .delete-button svg { width: 16px; height: 16px; }

    .empty-state {
      display: none;
      padding: 35px 20px 39px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state.visible { display: block; animation: arrive 220ms ease both; }
    .empty-icon { margin-bottom: 8px; font-size: 25px; }
    .empty-state strong { display: block; margin-bottom: 3px; color: var(--text); font-size: 15px; font-weight: 600; }
    .empty-state p { margin: 0; font-size: 14px; }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 19px 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .footer-note { display: flex; align-items: center; gap: 6px; }
    .footer-note span { color: var(--accent); }

    @keyframes arrive { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes task-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes task-out { to { opacity: 0; transform: translateX(10px); } }

    @media (max-width: 420px) {
      body { padding: 48px 16px 32px; }
      .toolbar, .footer { padding-right: 14px; padding-left: 14px; }
      .task-list { padding-right: 14px; padding-left: 14px; }
      .add-form { padding: 14px; }
      .clear-button { font-size: 12px; }
    }

    @media (hover: none) { .delete-button { opacity: .72; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow"><span class="sun" aria-hidden="true">☀</span> A little more intentional</p>
    <h1>Your day, in focus.</h1>
    <p class="subtitle">Make room for what matters, one thing at a time.</p>

    <section class="panel" aria-label="To-do list">
      <form class="add-form" id="add-form">
        <input id="task-input" type="text" maxlength="160" placeholder="Add a task…" aria-label="New task" autocomplete="off">
        <button class="add-button" type="submit" aria-label="Add task">+</button>
      </form>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" type="button" data-filter="done" aria-pressed="false">Done</button>
        </div>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </div>

      <ul class="task-list" id="task-list" aria-live="polite"></ul>
      <div class="empty-state" id="empty-state">
        <div class="empty-icon" aria-hidden="true">✦</div>
        <strong id="empty-title">All clear.</strong>
        <p id="empty-copy">A little space to breathe.</p>
      </div>
      <footer class="footer">
        <span id="task-count">0 tasks left</span>
        <span class="footer-note"><span aria-hidden="true">✳</span> Saved on this device</span>
      </footer>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "daylight-tasks-v1";
      const examples = [
        { id: "example-1", title: "Plan the week with a fresh cup of coffee", done: false },
        { id: "example-2", title: "Take a proper lunch break away from my desk", done: false },
        { id: "example-3", title: "Send a quick note to someone I appreciate", done: true }
      ];
      const list = document.querySelector("#task-list");
      const form = document.querySelector("#add-form");
      const input = document.querySelector("#task-input");
      const count = document.querySelector("#task-count");
      const empty = document.querySelector("#empty-state");
      const emptyTitle = document.querySelector("#empty-title");
      const emptyCopy = document.querySelector("#empty-copy");
      const clearButton = document.querySelector("#clear-completed");
      const filterButtons = [...document.querySelectorAll(".filter")];
      let activeFilter = "all";
      let tasks;

      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        tasks = saved === null ? examples : JSON.parse(saved);
        if (!Array.isArray(tasks)) throw new Error("Saved tasks are not a list.");
      } catch (error) {
        console.error("Could not load saved tasks; showing the example list instead.", error);
        tasks = examples;
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (error) {
          console.error("Could not save tasks to localStorage.", error);
        }
      }

      function render() {
        list.replaceChildren();
        const visible = tasks.filter(task =>
          activeFilter === "all" ||
          (activeFilter === "active" && !task.done) ||
          (activeFilter === "done" && task.done)
        );

        visible.forEach(task => {
          const item = document.createElement("li");
          item.className = `task${task.done ? " done" : ""}`;
          item.dataset.id = task.id;

          const label = document.createElement("label");
          label.className = "check-wrap";
          label.setAttribute("aria-label", `${task.done ? "Mark incomplete" : "Complete"}: ${task.title}`);

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = task.done;
          checkbox.setAttribute("aria-label", `${task.done ? "Mark incomplete" : "Complete"}: ${task.title}`);
          checkbox.addEventListener("change", () => {
            task.done = checkbox.checked;
            save();
            render();
          });

          const mark = document.createElement("span");
          mark.className = "checkmark";
          mark.setAttribute("aria-hidden", "true");
          mark.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="m3.5 8.2 3 3 6-6.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          label.append(checkbox, mark);

          const title = document.createElement("span");
          title.className = "task-title";
          title.textContent = task.title;

          const remove = document.createElement("button");
          remove.className = "delete-button";
          remove.type = "button";
          remove.setAttribute("aria-label", `Delete: ${task.title}`);
          remove.innerHTML = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4.5 6h11m-9.5 0 .6 9.2c.1.8.7 1.3 1.5 1.3h3.8c.8 0 1.4-.5 1.5-1.3L14 6M8 6V4.5c0-.6.4-1 1-1h2c.6 0 1 .4 1 1V6m-3 3v4m3-4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          remove.addEventListener("click", () => {
            item.classList.add("removing");
            item.addEventListener("animationend", () => {
              tasks = tasks.filter(entry => entry.id !== task.id);
              save();
              render();
            }, { once: true });
          });

          item.append(label, title, remove);
          list.append(item);
        });

        const remaining = tasks.filter(task => !task.done).length;
        count.textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"} left`;
        clearButton.hidden = !tasks.some(task => task.done);
        empty.classList.toggle("visible", visible.length === 0);
        emptyTitle.textContent = tasks.length === 0 ? "All clear." : "Nothing to see here.";
        emptyCopy.textContent = tasks.length === 0 ? "A little space to breathe." : "Try another filter to find your tasks.";
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const title = input.value.trim();
        if (!title) {
          input.focus();
          return;
        }
        tasks.unshift({ id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, title, done: false });
        input.value = "";
        activeFilter = "all";
        filterButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.filter === activeFilter)));
        save();
        render();
        input.focus();
      });

      filterButtons.forEach(button => button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        filterButtons.forEach(option => option.setAttribute("aria-pressed", String(option === button)));
        render();
      }));

      clearButton.addEventListener("click", () => {
        tasks = tasks.filter(task => !task.done);
        save();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
